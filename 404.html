<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jibril Tapiador</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <script>
    // GitHub Pages serves this for unknown paths. Routing is hash based, so
    // forward the requested path into the hash and let the app resolve it.
    (function () {
      var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
      window.location.replace("/" + (path ? "#/" + path : "") + window.location.search);
    })();
  </script>
</head>

<body>
  <p>Redirecting to <a href="/">jibriltapiador.com</a>&hellip;</p>
</body>

</html>
